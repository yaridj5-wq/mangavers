<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MangaVerse</title>
<meta name="description" content="Catalogue manga et anime avec quiz, couvertures, dates et statuts.">
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:14px 5%;background:#080b12e8;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.logo{font-size:24px;font-weight:1000;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
.top input{flex:1;max-width:560px;background:#111725;border:1px solid #ffffff18;color:#fff;border-radius:999px;padding:11px 16px}
.btn,.chip{border:0;cursor:pointer;color:#fff;font-weight:900}.btn{border-radius:999px;background:#7c3aed;padding:10px 14px}.chip{background:#ffffff0d;border:1px solid #ffffff16;padding:8px 12px;border-radius:999px}
.hero{padding:62px 5% 34px;background:radial-gradient(circle at 80% 18%,#7c3aed4d,transparent 35%),linear-gradient(#111827,#080b12)}
.hero h1{font-size:clamp(38px,7vw,78px);line-height:.94;margin:0}.hero p{color:#bac4d3;max-width:760px;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.wrap{padding:28px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#111725;border:1px solid #ffffff10;border-radius:18px;overflow:hidden;cursor:pointer;transition:.22s;min-height:330px}
.card:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 20px 55px #0009}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a2030}
.pad{padding:11px}.title{font-weight:950}.meta{font-size:12px;color:#aeb7c6;margin-top:5px}.on{color:#86efac;font-weight:900}.done{color:#fca5a5;font-weight:900}
.load{text-align:center;padding:40px;color:#bac4d3}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(8px)}
.modal.show{display:flex}.box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#101521;border:1px solid #ffffff18;border-radius:24px;padding:22px;animation:pop .35s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(22px)}to{opacity:1;transform:none}}.detail{display:grid;grid-template-columns:230px 1fr;gap:22px}.detail img{width:100%;border-radius:16px}.close{float:right;background:#ffffff12}
.quiz{margin-top:42px;background:linear-gradient(145deg,#111725,#0d111b);border:1px solid #ffffff14;border-radius:22px;padding:20px}.quizbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.quizbar input{flex:1;min-width:180px;background:#0b1019;border:1px solid #ffffff18;color:#fff;padding:11px;border-radius:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#171e2c;border:1px solid #ffffff18;color:white;padding:13px;border-radius:12px;text-align:left;cursor:pointer}.good{background:#065f46}.bad{background:#7f1d1d}
.score{font-weight:1000;color:#c4b5fd}.lb{margin-top:18px;border-top:1px solid #ffffff12}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff0d}
@media(max-width:650px){.detail{grid-template-columns:1fr}.detail img{max-width:260px;margin:auto}.opts{grid-template-columns:1fr}.top{flex-wrap:wrap}.top input{order:3;max-width:none;width:100%}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">MangaVerse</div>
  <input id="q" placeholder="Rechercher un manga ou anime…">
  <button class="btn" id="music">🎵 Musique</button>
</div>
<section class="hero">
  <h1>Explore.<br>Découvre.<br>Vibre.</h1>
  <p>Un catalogue manga/anime avec vraies couvertures, dates, statuts, résumés et un quiz pour défier tes amis.</p>
  <div class="chips">
    <button class="chip" data-filter="">Tous</button>
    <button class="chip" data-filter="Action">Action</button>
    <button class="chip" data-filter="Adventure">Aventure</button>
    <button class="chip" data-filter="Fantasy">Fantasy</button>
    <button class="chip" data-filter="Romance">Romance</button>
    <button class="chip" data-filter="Comedy">Comédie</button>
  </div>
</section>
<main class="wrap">
  <h2>🔥 Catalogue</h2>
  <div id="grid" class="grid"><div class="load">Chargement du catalogue…</div></div>
  <button class="btn" id="more" style="margin:22px auto;display:block">Charger plus</button>

  <section class="quiz">
    <h2>🎮 Quiz MangaVerse</h2>
    <div class="quizbar">
      <input id="name" maxlength="20" placeholder="Ton pseudo">
      <button class="btn" id="saveName">Valider</button>
      <span class="score" id="score">0 pt</span>
    </div>
    <h3 id="clue">Chargement…</h3>
    <div class="opts" id="opts"></div>
    <p id="feed"></p>
    <button class="btn" id="next">Question suivante</button>
    <div class="lb"><h3>🏆 Classement sur cet appareil</h3><div id="leader"></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box">
<button class="btn close" id="close">✕</button><div id="detail"></div>
</div></div>

<script>
const API='https://api.jikan.moe/v4';
let page=1,items=[],filter='',points=0,round=0,locked=false,currentQ=null,musicOn=false,audioCtx=null;
const grid=document.getElementById('grid');
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));

async function load(){
  if(!items.length)grid.innerHTML='<div class="load">Chargement…</div>';
  try{
    const r=await fetch(`${API}/top/anime?page=${page}&limit=24`);
    const j=await r.json();
    items.push(...j.data);page++;render();
  }catch(e){grid.innerHTML='<div class="load">Impossible de charger le catalogue. Vérifie la connexion Internet.</div>'}
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const a=items.filter(x=>(!filter||x.genres?.some(g=>g.name.includes(filter)))&&x.title.toLowerCase().includes(q));
  grid.innerHTML=a.map(x=>`<article class="card" data-id="${x.mal_id}">
    <img loading="lazy" src="${x.images?.jpg?.large_image_url||x.images?.jpg?.image_url||''}" alt="">
    <div class="pad"><div class="title">${esc(x.title)}</div>
    <div class="meta">📅 ${x.year||x.aired?.prop?.from?.year||'?'}</div>
    <div class="meta ${x.airing?'on':'done'}">${x.airing?'🟢 En cours':'🔴 Terminé'}</div>
    <div class="meta">⭐ ${x.score||'—'} · ${esc(x.type||'')}</div></div>
  </article>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openCard(c.dataset.id,c));
}
async function openCard(id,c){
  c.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:300});
  try{
    const r=await fetch(`${API}/anime/${id}/full`);const x=(await r.json()).data;
    document.getElementById('detail').innerHTML=`<div class="detail">
      <img src="${x.images?.jpg?.large_image_url||''}" alt="">
      <div><h1>${esc(x.title)}</h1>
      <p><b>📅 Sortie :</b> ${x.aired?.string||x.year||'Inconnue'}</p>
      <p><b>Statut :</b> ${x.airing?'🟢 En cours':'🔴 Terminé'}</p>
      <p><b>Genres :</b> ${esc((x.genres||[]).map(g=>g.name).join(', '))}</p>
      <p><b>Note :</b> ⭐ ${x.score||'—'}</p>
      <h3>Résumé</h3><p>${esc(x.synopsis||'Résumé indisponible pour le moment.')}</p></div></div>`;
    document.getElementById('modal').classList.add('show');
  }catch(e){}
}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};
document.getElementById('q').oninput=render;
document.getElementById('more').onclick=load;
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});

const questions=[
['Naruto','Quel manga suit un jeune ninja qui rêve de devenir Hokage ?'],
['One Piece','Quel manga suit Monkey D. Luffy à la recherche du trésor ultime ?'],
['Death Note','Dans quel manga un carnet peut tuer une personne dont le nom est écrit ?'],
['Attack on Titan','Dans quel anime l’humanité vit-elle derrière d’immenses murs ?'],
['Demon Slayer','Dans quel manga Tanjiro tente-t-il de sauver Nezuko ?'],
['Jujutsu Kaisen','Dans quel anime Yuji Itadori avale-t-il un objet maudit ?'],
['Hunter x Hunter','Dans quel manga Gon cherche-t-il son père ?'],
['My Hero Academia','Quel manga se déroule dans un monde où presque tous possèdent un Alter ?'],
['Chainsaw Man','Dans quel manga Denji fusionne-t-il avec Pochita ?'],
['Spy x Family','Dans quel manga un espion crée-t-il une fausse famille ?'],
['Blue Lock','Quel manga met en scène un programme pour créer le meilleur attaquant japonais ?'],
['Frieren','Quel manga suit une elfe magicienne après la fin de son aventure héroïque ?'],
['Bleach','Dans quel manga Ichigo devient-il Shinigami ?'],
['Dragon Ball Z','Quel anime met en scène Son Goku et les Dragon Balls ?'],
['Tokyo Ghoul','Dans quel manga Ken Kaneki devient-il à moitié goule ?'],
['Vinland Saga','Quel manga suit Thorfinn dans un récit de Vikings ?'],
['One Punch Man','Quel héros bat presque tous ses ennemis en un seul coup ?'],
['Haikyuu!!','Quel manga est centré sur le volley-ball lycéen ?'],
['Dr. Stone','Dans quel manga Senku reconstruit-il la civilisation grâce à la science ?'],
['Solo Leveling','Quel titre suit Sung Jinwoo, un chasseur qui gagne des niveaux ?'],
['Dandadan','Quel manga mélange extraterrestres, esprits et romance ?'],
['Kaiju No. 8','Dans quel manga Kafka Hibino acquiert-il le pouvoir d’un kaiju ?'],
['Tokyo Revengers','Quel manga mélange gangs et voyages dans le temps ?'],
['Code Geass','Quel anime suit Lelouch et le pouvoir du Geass ?'],
['Overlord','Dans quel anime un joueur reste-t-il coincé dans son avatar squelette ?'],
['Konosuba','Quel anime parodie l’isekai avec Kazuma et Aqua ?'],
['Berserk','Quel manga sombre suit Guts et son épée gigantesque ?'],
['Monster','Quel manga suit le docteur Tenma et Johan Liebert ?'],
['Sailor Moon','Quel anime met en scène Usagi Tsukino ?'],
['Black Clover','Dans quel manga Asta veut-il devenir Empereur-Mage ?']
];
let player=localStorage.getItem('mv_player')||'Joueur';
document.getElementById('name').value=player;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function quiz(){
  if(round>=10){finish();return}
  locked=false;currentQ=questions[Math.floor(Math.random()*questions.length)];
  const wrong=shuffle(questions.filter(q=>q[0]!==currentQ[0])).slice(0,3).map(q=>q[0]);
  document.getElementById('clue').textContent=`Question ${round+1}/10 — ${currentQ[1]}`;
  document.getElementById('feed').textContent='';
  document.getElementById('opts').innerHTML=shuffle([currentQ[0],...wrong]).map(x=>`<button class="opt">${esc(x)}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  if(locked)return;locked=true;
  if(b.textContent===currentQ[0]){points+=100;b.classList.add('good');document.getElementById('feed').textContent='✅ Bonne réponse ! +100 points'}
  else{b.classList.add('bad');document.getElementById('feed').textContent=`❌ Bonne réponse : ${currentQ[0]}`;[...document.querySelectorAll('.opt')].find(x=>x.textContent===currentQ[0])?.classList.add('good')}
  document.getElementById('score').textContent=points+' pt';
}
function finish(){
  const lb=JSON.parse(localStorage.getItem('mv_lb')||'{}');const o=lb[player]||{best:0,games:0};lb[player]={best:Math.max(o.best,points),games:o.games+1};localStorage.setItem('mv_lb',JSON.stringify(lb));renderLB();
  document.getElementById('clue').textContent=`Partie terminée : ${points} points`;document.getElementById('opts').innerHTML='';document.getElementById('feed').textContent='🏆 Ton score est enregistré sur cet appareil.';
}
document.getElementById('next').onclick=()=>{if(!locked)return;round++;quiz()};
document.getElementById('saveName').onclick=()=>{player=document.getElementById('name').value.trim()||'Joueur';localStorage.setItem('mv_player',player)};
function renderLB(){const lb=JSON.parse(localStorage.getItem('mv_lb')||'{}');const r=Object.entries(lb).map(([n,v])=>({n,...v})).sort((a,b)=>b.best-a.best).slice(0,10);document.getElementById('leader').innerHTML=r.length?r.map((x,i)=>`<div class="row"><span>${i<3?['🥇','🥈','🥉'][i]:i+1} ${esc(x.n)}</span><b>${x.best} pts</b></div>`).join(''):'<div class="row"><span>Aucun score</span><b>—</b></div>'}
function tone(ctx,f,t,d=.12,v=.025){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d)}
function musicLoop(){if(!musicOn||!audioCtx)return;const now=audioCtx.currentTime+.05,seq=[220,261.6,329.6,440,329.6,293.7,261.6,196];seq.forEach((f,i)=>tone(audioCtx,f,now+i*.18,.16,.018));setTimeout(musicLoop,1450)}
document.getElementById('music').onclick=async()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();musicOn=!musicOn;document.getElementById('music').textContent=musicOn?'⏸ Pause':'🎵 Musique';if(musicOn)musicLoop()};
renderLB();quiz();load();
</script>
</body></html>
